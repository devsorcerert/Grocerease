name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm install @react-native-google-signin/google-signin @react-navigation/native-stack --legacy-peer-deps

      - name: Run lint checks
        working-directory: frontend
        run: npm run lint

      - name: Run type checks
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Write environment file
        working-directory: frontend
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ secrets.API_BASE_URL }}" >> .env
          echo "EXPO_PUBLIC_BACKEND_URL=${{ secrets.API_BASE_URL }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB=${{ secrets.GOOGLE_CLIENT_ID_WEB }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_CLIENT_ID_ANDROID=${{ secrets.GOOGLE_CLIENT_ID_ANDROID }}" >> .env
          echo "EXPO_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" >> .env

      - name: Generate native Android folder
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Print SHA-1 Certificate Fingerprint
        run: |
          echo "========================================"
          echo "  GROCEREASE APK - SHA-1 FINGERPRINT"
          echo "  Use this in Google Cloud Console"
          echo "  Package: com.grocereasetv.app"
          echo "========================================"
          keytool -printcert -jarfile frontend/android/app/build/outputs/apk/release/app-release.apk 2>/dev/null | grep -E "SHA1:|SHA-1:"
          echo "========================================"

      - name: Rename APK
        run: |
          mkdir -p /home/runner/apk-output
          cp frontend/android/app/build/outputs/apk/release/app-release.apk \
            /home/runner/apk-output/GrocerEase-release-${{ github.sha }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrocerEase-release-${{ github.sha }}
          path: /home/runner/apk-output/GrocerEase-release-${{ github.sha }}.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Release Build #${{ github.run_number }}"
          body: |
            **Automatic release build**
            Commit: `${{ github.sha }}`
            Branch: `${{ github.ref_name }}`
          files: /home/runner/apk-output/GrocerEase-release-${{ github.sha }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
