name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          MONGO_URL: mongodb://localhost:27017/grocerease_test
          JWT_SECRET_KEY: testsecretkeyformonitoringandtesting12345
        run: |
          pytest

  test-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'admin-portal/package-lock.json'

      - name: Install dependencies
        working-directory: admin-portal
        run: npm ci --legacy-peer-deps

      - name: Run admin portal tests
        working-directory: admin-portal
        env:
          CI: true
        run: npm test -- --passWithNoTests

  build:
    needs: [test-backend, test-admin]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps
          npm install @react-native-google-signin/google-signin @react-navigation/native-stack --legacy-peer-deps

      - name: Run lint checks
        working-directory: frontend
        run: npm run lint

      - name: Run type checks
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Write environment file
        working-directory: frontend
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ secrets.API_BASE_URL }}" >> .env
          echo "EXPO_PUBLIC_BACKEND_URL=${{ secrets.API_BASE_URL }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB=${{ secrets.GOOGLE_CLIENT_ID_WEB }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_CLIENT_ID_ANDROID=${{ secrets.GOOGLE_CLIENT_ID_ANDROID }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_CLIENT_ID_IOS=${{ secrets.GOOGLE_CLIENT_ID_IOS }}" >> .env
          echo "EXPO_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" >> .env

      - name: Generate google-services.json for Android
        working-directory: frontend
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > ./google-services.json
            echo "google-services.json generated from secret"
          else
            echo "WARNING: GOOGLE_SERVICES_JSON secret not set - Google Sign-In may not work on Android"
          fi

      - name: Generate native Android folder
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Print SHA-1 Certificate Fingerprint
        run: |
          echo "========================================"
          echo " GROCEREASE APK - SHA-1 FINGERPRINT"
          echo " Use this in Google Cloud Console"
          echo " Package: com.grocereasetv.app"
          echo "========================================"
          keytool -printcert -jarfile frontend/android/app/build/outputs/apk/release/app-release.apk 2>/dev/null | grep -E "SHA1:|SHA-1:" || true
          echo "========================================"

      - name: Rename APK
        run: |
          mkdir -p /home/runner/apk-output
          cp frontend/android/app/build/outputs/apk/release/app-release.apk \
          /home/runner/apk-output/GrocerEase-release-${{ github.sha }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrocerEase-release-${{ github.sha }}
          path: /home/runner/apk-output/GrocerEase-release-${{ github.sha }}.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Release Build #${{ github.run_number }}"
          body: |
            **Automatic release build**
            Commit: `${{ github.sha }}`
            Branch: `${{ github.ref_name }}`
          files: /home/runner/apk-output/GrocerEase-release-${{ github.sha }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
