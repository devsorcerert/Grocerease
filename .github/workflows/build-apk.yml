name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          MONGO_URL: mongodb://localhost:27017/grocerease_test
          JWT_SECRET_KEY: testsecretkeyformonitoringandtesting12345
        run: |
          pytest tests/

  test-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'admin-portal/package-lock.json'

      - name: Install dependencies
        working-directory: admin-portal
        run: npm ci --legacy-peer-deps

      - name: Run admin portal tests
        working-directory: admin-portal
        env:
          CI: true
        run: npm test -- --passWithNoTests

  build:
    needs: [test-backend, test-admin]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps
          npm install @react-native-google-signin/google-signin @react-navigation/native-stack --legacy-peer-deps

      - name: Run lint checks
        working-directory: frontend
        run: npm run lint

      - name: Run type checks
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Write environment file
        working-directory: frontend
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          GOOGLE_CLIENT_ID_WEB: ${{ secrets.GOOGLE_CLIENT_ID_WEB }}
          GOOGLE_CLIENT_ID_ANDROID: ${{ secrets.GOOGLE_CLIENT_ID_ANDROID }}
          GOOGLE_CLIENT_ID_IOS: ${{ secrets.GOOGLE_CLIENT_ID_IOS }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          BACKEND_URL="${API_BASE_URL:-https://api.grocereasetv.com}"
          echo "EXPO_PUBLIC_API_URL=$BACKEND_URL" >> .env
          echo "EXPO_PUBLIC_BACKEND_URL=$BACKEND_URL" >> .env
          echo "EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB=${GOOGLE_CLIENT_ID_WEB:-418665414188-rl2jg740eersokldgp9ojnr6ue7uvc0r.apps.googleusercontent.com}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_CLIENT_ID_ANDROID=${GOOGLE_CLIENT_ID_ANDROID:-418665414188-mdmkg84jnujtmr3nvhkop74ifp78nr9k.apps.googleusercontent.com}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_CLIENT_ID_IOS=${GOOGLE_CLIENT_ID_IOS:-418665414188-3teeuukmq7m66m5lra36mc6be32i1n2f.apps.googleusercontent.com}" >> .env
          echo "EXPO_PUBLIC_RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}" >> .env
          echo "FIREBASE_API_KEY=${FIREBASE_API_KEY:-}" >> .env
          echo "EXPO_PUBLIC_ADMIN_EMAIL=grocereasetv@gmail.com" >> .env
          echo "Backend URL set to: $BACKEND_URL"

      - name: Generate google-services.json for Android
        working-directory: frontend
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > ./google-services.json
            echo "google-services.json generated from secret"
          else
            echo "WARNING: GOOGLE_SERVICES_JSON secret not set - Google Sign-In may not work on Android"
          fi

      - name: Inject secrets into google-services.json
        working-directory: frontend
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: node scripts/inject-secrets.js

      - name: Generate native Android folder
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Restore or generate consistent debug keystore
        working-directory: frontend/android/app
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "debug.keystore restored from secret (consistent SHA-1)"
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "WARNING: Generated new keystore - copy base64 from next step and save as DEBUG_KEYSTORE_BASE64 secret"
          else
            echo "debug.keystore already present"
          fi

      - name: Restore release keystore from cache
        id: cache-release-keystore
        uses: actions/cache@v4
        with:
          path: frontend/android/app/release.keystore
          key: release-keystore-grocerease-v1

      - name: Decode or generate release keystore for signing
        working-directory: frontend/android/app
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "release.keystore decoded from RELEASE_KEYSTORE_BASE64 secret"
          elif [ -f release.keystore ]; then
            echo "release.keystore restored from cache"
          else
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is not set. Cannot generate a release keystore without a password." >&2
            echo "Set RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD in repo secrets." >&2
            exit 1
          fi

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          # Release keystore env vars — read by signingConfigs.release in build.gradle
          RELEASE_STORE_PATH: ${{ github.workspace }}/frontend/android/app/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          mkdir -p /home/runner/apk-output
          cp frontend/android/app/build/outputs/apk/release/app-release.apk \
            /home/runner/apk-output/GrocerEase-release-${{ github.sha }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrocerEase-release-${{ github.sha }}
          path: /home/runner/apk-output/GrocerEase-release-${{ github.sha }}.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Release Build #${{ github.run_number }}"
          body: |
            **Automatic release build**
            Commit: `${{ github.sha }}`
            Branch: `${{ github.ref_name }}`
          files: /home/runner/apk-output/GrocerEase-release-${{ github.sha }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
