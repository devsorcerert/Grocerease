name: Migration Dry-Run

on:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install motor==3.3.2 "pymongo[srv]==4.6.3" python-dotenv

      - name: Run migration dry-run
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          DB_NAME: grocerease
          DRY_RUN: "1"
        run: |
          cd backend
          python migrate_product_schema.py 2>&1 | tee /tmp/dryrun-output.txt
          echo "--- EXIT CODE: $? ---"

      - name: Upload dry-run output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dryrun-output
          path: /tmp/dryrun-output.txt
