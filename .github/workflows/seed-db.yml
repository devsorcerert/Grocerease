name: Seed Database (one-shot)

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Seed products via admin API
        run: |
          pip install requests -q
          echo ' ' | base64 -d > /tmp/seed.py
          python3 /tmp/seed.py
