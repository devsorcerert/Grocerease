r = requests.post(f"{BASE}/api/admin/login", json={"email":EMAIL,"password":PASSWORD}, timeout=30)
if r.status_code != 200:
    print(f"Login failed {r.status_code}: {r.text}"); sys.exit(1)
token = r.json().get("token")
print(f"Logged in OK. Seeding {len(PRODUCTS)} products...")
headers = {"Authorization":f"Bearer {token}","Content-Type":"application/json"}
ok = fail = 0
for p in PRODUCTS:
    res = requests.post(f"{BASE}/api/admin/products", headers=headers, json=p, timeout=30)
    if res.status_code in (200,201): ok+=1; print(f"  OK  {p['name']}")
    else: fail+=1; print(f"  ERR {p['name']} => {res.status_code}: {res.text[:60]}")
    time.sleep(0.1)
print(f"Done: {ok} inserted, {fail} failed.")
PYEOF
