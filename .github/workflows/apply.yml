name: Apply Backend Changes
on:
  push:
    paths:
      - 'scripts/apply_changes.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Python Script
        run: python scripts/apply_changes.py
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/server.py
          git commit -m "Apply backend security & correctness changes" || echo "No changes to commit"
          git push
      - name: Trigger APK Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-apk.yml --ref main